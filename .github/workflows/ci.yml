name: Python CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE*"

env:
  PYTHON_VERSION: "3.14"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-and-basic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: chainguard-actions/actions-setup-python@54626a9f20a67b48c7f84a1362272e3a2e22000c # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: chainguard-actions/astral-sh-setup-uv@d074662c6bd48040f94d5f5eeae1479d285f0177 # v10.3.3

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with ruff
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run unit tests
        run: |
          uv run python -m pytest tests/ -v --cov=src/docling_japanese_books --cov-report=xml

      - name: Test CLI help commands
        run: |
          uv run docling-japanese-books --help
          uv run docling-japanese-books download --help
          uv run docling-japanese-books process --help
          uv run docling-japanese-books search --help

      - name: Upload coverage reports
        uses: chainguard-actions/codecov-codecov-action@4e95a2ab133962d45d778e4ce39d1e21e4e536de # v7.1.1
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
